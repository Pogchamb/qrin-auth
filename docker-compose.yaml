services:
  postgres:
    image: postgres:15-alpine
    container_name: club-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-club_db}
      POSTGRES_USER: ${POSTGRES_USER:-club_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-club_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-club_user} -d ${POSTGRES_DB:-club_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
