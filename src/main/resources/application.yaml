spring:
  application:
    name: qrin-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club_db}
    username: ${DB_USER:club_user}
    password: ${DB_PASSWORD:club_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: never

